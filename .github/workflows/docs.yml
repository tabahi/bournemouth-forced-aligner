# Builds the documentation site (mkdocs.yml, pages in docs/) and publishes it to GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/mkdocs_hooks.py"
      - "evaluation/plots/**"
      - "examples/samples/images/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material==9.8.*"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # Only the public repository has a Pages site. Forks still run the build as a check.
    if: github.repository == 'speech-industry/bournemouth-forced-aligner'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
